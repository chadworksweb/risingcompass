# Redirect HTTP to HTTPS for all domains
server {
    listen 80;
    server_name risingcompass.net www.risingcompass.net api.risingcompass.net;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://risingcompass.net$request_uri;
    }
}

# Redirect www to non-www (HTTPS)
server {
    listen 443 ssl;
    server_name www.risingcompass.net;

    ssl_certificate /etc/letsencrypt/live/risingcompass.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/risingcompass.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://risingcompass.net$request_uri;
}

# Frontend — risingcompass.net
server {
    listen 443 ssl;
    server_name risingcompass.net;

    ssl_certificate /etc/letsencrypt/live/risingcompass.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/risingcompass.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API — api.risingcompass.net
server {
    listen 443 ssl;
    server_name api.risingcompass.net;

    ssl_certificate /etc/letsencrypt/live/risingcompass.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/risingcompass.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
