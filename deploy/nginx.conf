# Redirect HTTP to HTTPS for all domains
server {
    listen 80;
    server_name risingcompass.net www.risingcompass.net api.risingcompass.net chadrising.com www.chadrising.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Redirect www to non-www — risingcompass.net
server {
    listen 443 ssl;
    server_name www.risingcompass.net;

    ssl_certificate /etc/letsencrypt/live/risingcompass.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/risingcompass.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    return 301 https://risingcompass.net$request_uri;
}

# Frontend — risingcompass.net
server {
    listen 443 ssl;
    server_name risingcompass.net;

    ssl_certificate /etc/letsencrypt/live/risingcompass.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/risingcompass.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API — api.risingcompass.net
server {
    listen 443 ssl;
    server_name api.risingcompass.net;

    ssl_certificate /etc/letsencrypt/live/risingcompass.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/risingcompass.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect www to non-www — chadrising.com
server {
    listen 443 ssl;
    server_name www.chadrising.com;

    ssl_certificate /etc/letsencrypt/live/chadrising.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chadrising.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    return 301 https://chadrising.com$request_uri;
