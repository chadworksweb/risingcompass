{% extends "admin/_base.html" %}
{% set active_section = 'users' %}
{% block title %}User detail -- Admin{% endblock %}

{% block subtabs %}
<nav class="admin-subtabs" aria-label="User detail tabs">
  <a class="admin-subtab" href="/api/admin/dashboard/users">All users</a>
  <a class="admin-subtab" href="#" data-tab="profile" id="tab-profile">Profile</a>
  <a class="admin-subtab active" href="#" data-tab="activity" id="tab-activity">Activity</a>
  <a class="admin-subtab" href="#" data-tab="calibrations" id="tab-calibrations">Calibrations</a>
  <a class="admin-subtab" href="#" data-tab="submissions" id="tab-submissions">Submissions</a>
  <a class="admin-subtab" href="#" data-tab="payments" id="tab-payments">Payments</a>
  <a class="admin-subtab" href="#" data-tab="comments" id="tab-comments">Comments</a>
  <!-- motions tab removed: governance moved to the Libra Engine Compass (lecg) -->

</nav>
{% endblock %}

{% block content %}
<style>
  .ud-card { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 8px; padding: 1.1rem 1.25rem; margin-bottom: 1rem; }
  .ud-handle { font-family: monospace; font-size: 1.2rem; font-weight: 700; color: var(--accent-strong); margin: 0; }
  .ud-anon { font-family: monospace; font-size: 0.78rem; color: var(--text-hint); }
  .ud-headrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .ud-ph-link { font-size: 0.78rem; font-weight: 700; text-decoration: none; padding: 0.35rem 0.7rem; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent-strong); background: rgba(0,143,114,0.08); white-space: nowrap; }
  .ud-ph-link:hover { background: rgba(0,143,114,0.16); }
  .ud-meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem 1.25rem; margin-top: 0.8rem; }
  .ud-meta-grid dt { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); font-weight: 700; margin-bottom: 0.1rem; }
  .ud-meta-grid dd { margin: 0; font-size: 0.88rem; color: var(--text); }
  .ud-tier-badge { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.7rem; padding: 0.15rem 0.6rem; border-radius: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .ud-tier-badge.id_verified { background: rgba(0, 143, 114, 0.12); color: var(--accent-strong); border: 1px solid var(--accent); }
  .ud-tier-badge.handled { background: var(--panel-strong); color: var(--text-dim); border: 1px solid var(--border); }
  .ud-tier-badge.pending { background: #fff0d0; color: var(--tier-orange); border: 1px solid var(--tier-orange); }
  .ud-status-banned { color: var(--red); font-weight: 700; }
  .ud-status-suspended { color: var(--tier-orange); font-weight: 700; }
  .ud-verifications { font-family: monospace; font-size: 0.78rem; }
  .ud-verifications th, .ud-verifications td { padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--border-soft); }
  .ud-comments-filters { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
  .ud-comment-card { padding: 0.7rem 0.9rem; border: 1px solid var(--border-soft); border-radius: 5px; margin-bottom: 0.5rem; background: var(--panel); border-left: 3px solid var(--accent); }
  .ud-comment-card.state-withdrawn { border-left-color: var(--text-dim); }
  .ud-comment-card.state-hidden { border-left-color: var(--tier-orange); }
  .ud-comment-card.state-deleted { border-left-color: var(--red); opacity: 0.85; }
  .ud-comment-meta { display: flex; gap: 0.8rem; flex-wrap: wrap; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 0.3rem; align-items: center; }
  .ud-comment-state { font-size: 0.65rem; padding: 0.05rem 0.4rem; border-radius: 3px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .ud-state-live { background: rgba(0, 143, 114, 0.12); color: var(--accent-strong); }
  .ud-state-withdrawn { background: var(--panel-strong); color: var(--text-dim); }
  .ud-state-hidden { background: #fff0d0; color: var(--tier-orange); }
  .ud-state-deleted { background: #fce4dc; color: var(--red); }
  .ud-comment-body { font-size: 0.88rem; line-height: 1.5; color: var(--text); white-space: pre-wrap; word-wrap: break-word; padding: 0.25rem 0; }
  .ud-comment-target { font-family: monospace; font-size: 0.72rem; color: var(--text-hint); }
  .ud-comment-hidden-reason { font-size: 0.78rem; color: var(--tier-orange); margin-top: 0.3rem; padding: 0.3rem 0.5rem; background: rgba(255, 187, 51, 0.08); border-left: 2px solid var(--tier-orange); border-radius: 0 3px 3px 0; }

  /* Activity timeline */
  .ud-act-row { display: flex; gap: 0.7rem; align-items: baseline; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--border-soft); font-size: 0.86rem; }
  .ud-act-type { flex-shrink: 0; width: 92px; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.12rem 0.35rem; border-radius: 3px; text-align: center; }
  .ud-act-when { flex-shrink: 0; width: 150px; font-family: monospace; font-size: 0.72rem; color: var(--text-hint); }
  .ud-act-summary { flex: 1; color: var(--text); word-wrap: break-word; }
  .ud-act-summary a { color: var(--accent-strong); }
  .t-comment { background: rgba(0,143,114,0.12); color: var(--accent-strong); }
  .t-calibration { background: rgba(64,96,255,0.12); color: #3a57d6; }
  .t-misread { background: #fff0d0; color: var(--tier-orange); }
  .t-motion { background: #efe4fb; color: #6b3fa0; }
  .t-argument { background: #e6e0f5; color: #6b3fa0; }
  .t-payment { background: rgba(0,143,114,0.08); color: var(--accent-strong); }
  .t-verification { background: var(--panel-strong); color: var(--text-dim); }

  /* Generic list cards (calibrations / submissions / motions) */
  .ud-li { padding: 0.65rem 0.85rem; border: 1px solid var(--border-soft); border-radius: 5px; margin-bottom: 0.5rem; background: var(--panel); }
  .ud-li-meta { display: flex; gap: 0.7rem; flex-wrap: wrap; align-items: center; font-size: 0.76rem; color: var(--text-dim); margin-bottom: 0.25rem; }
  .ud-pill { font-size: 0.64rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.08rem 0.45rem; border-radius: 3px; background: var(--panel-strong); color: var(--text-dim); }
  .ud-led { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 0.78rem; }
  .ud-led th, .ud-led td { padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--border-soft); text-align: left; }
  .ud-led .pos { color: var(--accent-strong); }
  .ud-led .neg { color: var(--red); }
  .ud-subhead { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 1rem 0 0.5rem; }

  /* Admin billing actions */
  .ud-comp-row, .ud-grant-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 0.7rem 0; border-bottom: 1px solid var(--border-soft); }
  .ud-grant-row { border-bottom: none; }
  .ud-grant-controls { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .ud-input { padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 5px; background: var(--panel); color: var(--text); font-size: 0.85rem; }
  .ud-input { width: 110px; }
  .ud-input-note { width: 180px; }
  .ud-btn { padding: 0.4rem 0.9rem; border: 1px solid var(--accent); border-radius: 6px; background: rgba(0,143,114,0.08); color: var(--accent-strong); font-weight: 700; font-size: 0.82rem; cursor: pointer; white-space: nowrap; }
  .ud-btn:hover { background: rgba(0,143,114,0.16); }
  .ud-btn:disabled { opacity: 0.5; cursor: default; }
  .ud-bill-note { font-size: 0.8rem; color: var(--text-dim); margin: 0.6rem 0 0; min-height: 1.1em; }
</style>

<div id="ud-panel-profile" style="display:none;"></div>
<div id="ud-panel-activity"></div>
<div id="ud-panel-calibrations" style="display:none;"></div>
<div id="ud-panel-submissions" style="display:none;"></div>
<div id="ud-panel-payments" style="display:none;"></div>
<div id="ud-panel-comments" style="display:none;">
  <div class="ud-comments-filters" id="udCommentFilters">
    <button class="filter-btn active" data-state="">All</button>
    <button class="filter-btn" data-state="live">Live</button>
    <button class="filter-btn" data-state="withdrawn">Withdrawn</button>
    <button class="filter-btn" data-state="hidden">Hidden</button>
    <button class="filter-btn" data-state="deleted">Deleted</button>
  </div>
  <div id="udCommentList"></div>
</div>

<div class="status-msg" id="udStatus"></div>
{% endblock %}

{% block scripts %}
<script>
const USER_IDENT = {{ anon_id | tojson }};
const TABS = ['profile', 'activity', 'calibrations', 'submissions', 'payments', 'comments'];
let commentFilter = '';

function onAdminReady() {
  document.querySelectorAll('.admin-subtab[data-tab]').forEach((a) => {
    a.addEventListener('click', (ev) => { ev.preventDefault(); showTab(a.dataset.tab); });
  });
  document.querySelectorAll('#udCommentFilters .filter-btn').forEach((b) => {
    b.addEventListener('click', () => {
      commentFilter = b.dataset.state || '';
      document.querySelectorAll('#udCommentFilters .filter-btn').forEach((x) => x.classList.toggle('active', x === b));
      loadComments();
    });
  });
  // Profile loads always (header info). Deep-link via #tab in the hash.
  loadProfile();
  const hashTab = (window.location.hash || '').replace('#', '');
  showTab(TABS.includes(hashTab) ? hashTab : 'activity');
}

const LOADERS = {
  profile: loadProfile,
  activity: loadActivity,
  calibrations: loadCalibrations,
  submissions: loadSubmissions,
  payments: loadPayments,
  comments: loadComments,
};

function showTab(name) {
  TABS.forEach((n) => {
    const panel = document.getElementById('ud-panel-' + n);
    if (panel) panel.style.display = (n === name) ? '' : 'none';
    const tab = document.getElementById('tab-' + n);
    if (tab) tab.classList.toggle('active', n === name);
  });
  const panel = document.getElementById('ud-panel-' + name);
  if (panel && !panel.dataset.loaded && LOADERS[name]) LOADERS[name]();
}

async function fetchJson(path) {
  const resp = await adminFetch(path);
  if (!resp.ok) throw new Error(await resp.text());
  return resp.json();
}

function fail(el, err) {
  el.innerHTML = `<p style="color:var(--red);">${esc((err && err.message) || 'Failed.')}</p>`;
}

function loading(el) { el.innerHTML = '<p style="color:#666;">Loading...</p>'; }

// Emit a <time data-utc> element so it renders in the admin's chosen zone and
// hot-reloads when the timezone picker changes (see _base.html).
function dt(s) { return s ? `<time data-utc="${escHtml(s)}"></time>` : '--'; }

// ---------- Profile ----------
async function loadProfile() {
  const el = document.getElementById('ud-panel-profile');
  loading(el);
  try {
    const data = await fetchJson(`/api/admin/users/${encodeURIComponent(USER_IDENT)}`);
    renderProfile(data);
    el.dataset.loaded = '1';
  } catch (err) { fail(el, err); }
}

function renderProfile(data) {
  const u = data.user;
  const tierLabel = { id_verified: 'Verified person', handled: 'Tier 1', pending: 'Pending' }[u.tier] || u.tier;
  let statusBlock;
  if (u.status === 'banned') {
    statusBlock = `<span class="ud-status-banned">Banned</span> &middot; <span style="color:var(--text-dim);">${esc(u.banned_reason || '')}</span>`;
  } else if (u.status === 'suspended') {
    statusBlock = `<span class="ud-status-suspended">Suspended</span> until ${dt(u.suspended_until)}`;
  } else {
    statusBlock = `<span style="color:var(--accent-strong);">Active</span>`;
  }

  const phBtn = u.posthog_person_url
    ? `<a class="ud-ph-link" href="${esc(u.posthog_person_url)}" target="_blank" rel="noopener">View in PostHog &#8599;</a>`
    : '';

  const verRows = data.verifications.length
    ? data.verifications.map((v) => `
        <tr>
          <td>${esc(v.provider)}</td>
          <td>${esc(v.status)}</td>
          <td>${dt(v.verified_at)}</td>
          <td>${dt(v.created_at)}</td>
          <td style="color:var(--text-hint);">${esc((v.provider_reference || '').slice(0, 24) + '...')}</td>
        </tr>`).join('')
    : `<tr><td colspan="5" style="color:var(--text-hint);">No verification attempts.</td></tr>`;

  document.getElementById('ud-panel-profile').innerHTML = `
    <div class="ud-card">
      <div class="ud-headrow">
        <div>
          <p class="ud-handle">${u.handle ? '@' + esc(u.handle) : '(no handle)'}</p>
          <p class="ud-anon">${esc(u.anon_id)}</p>
        </div>
        ${phBtn}
      </div>
      <dl class="ud-meta-grid">
        <div><dt>Tier</dt><dd><span class="ud-tier-badge ${esc(u.tier)}">${esc(tierLabel)}</span></dd></div>
        <div><dt>Status</dt><dd>${statusBlock}</dd></div>
        <div><dt>Subscription</dt><dd>${esc(u.subscription_tier || 'free')}${u.subscription_status ? ' (' + esc(u.subscription_status) + ')' : ''}</dd></div>
        <div><dt>Credits</dt><dd>${u.allowance_credits} allowance / ${u.purchased_credits} purchased</dd></div>
        <div><dt>Unlimited Charger</dt><dd>${u.comp_unlimited ? '<strong style="color:var(--accent-strong);">ON</strong>' : 'off'}</dd></div>
        <div><dt>Comments</dt><dd>${u.comment_count}</dd></div>
        <div><dt>Calibrations</dt><dd>${u.calibration_count}</dd></div>
        <div><dt>Misreads</dt><dd>${u.misread_count}</dd></div>
        <div><dt>Joined</dt><dd>${dt(u.created_at)}</dd></div>
      </dl>
    </div>
    <div class="ud-card">
      <h2 class="section-title" style="margin-top:0;">Verification history</h2>
      <table class="ud-verifications" style="width:100%;border-collapse:collapse;">
        <thead><tr><th style="text-align:left;">Provider</th><th style="text-align:left;">Status</th><th style="text-align:left;">Verified</th><th style="text-align:left;">Created</th><th style="text-align:left;">Session ref</th></tr></thead>
        <tbody>${verRows}</tbody>
      </table>
    </div>`;
}

// ---------- Activity timeline ----------
async function loadActivity() {
  const el = document.getElementById('ud-panel-activity');
  loading(el);
  try {
    const data = await fetchJson(`/api/admin/users/${encodeURIComponent(USER_IDENT)}/activity?limit=300`);
    if (!data.items.length) { el.innerHTML = '<div class="ud-card">No recorded activity.</div>'; el.dataset.loaded = '1'; return; }
    el.innerHTML = `<div class="ud-card" style="padding:0.4rem 0.6rem;">
      <p style="color:var(--text-dim);font-size:0.78rem;margin:0.4rem 0.4rem 0.6rem;">${data.items.length} of ${data.total} events</p>
      ${data.items.map((e) => `
        <div class="ud-act-row">
          <span class="ud-act-type t-${esc(e.type)}">${esc(e.type)}</span>
          <span class="ud-act-when">${dt(e.when)}</span>
          <span class="ud-act-summary">${e.link ? `<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.summary)}</a>` : esc(e.summary)}</span>
        </div>`).join('')}
    </div>`;
    el.dataset.loaded = '1';
  } catch (err) { fail(el, err); }
}

// ---------- Calibrations ----------
async function loadCalibrations() {
  const el = document.getElementById('ud-panel-calibrations');
  loading(el);
  try {
    const data = await fetchJson(`/api/admin/users/${encodeURIComponent(USER_IDENT)}/calibrations?limit=300`);
    if (!data.items.length) { el.innerHTML = '<div class="ud-card">No Lyrical Charger calibrations (signed-in).</div>'; el.dataset.loaded = '1'; return; }
    el.innerHTML = `<p style="color:var(--text-dim);font-size:0.78rem;margin-bottom:0.6rem;">${data.items.length} of ${data.total}</p>` +
      data.items.map((c) => `
        <div class="ud-li">
          <div class="ud-li-meta">
            <span class="ud-pill">${esc(c.rubric_color || '?')}</span>
            <span>charge ${c.charge_value != null ? c.charge_value : '?'}</span>
            <span>${dt(c.calibrated_at)}</span>
            <span style="color:var(--text-hint);">${esc(c.song_source)}#${c.song_id}</span>
          </div>
          <div style="font-weight:600;">${c.song_slug ? `<a href="/songs/${esc(c.song_slug)}/" target="_blank" rel="noopener">${esc(c.title || '?')}</a>` : esc(c.title || '?')} <span style="color:var(--text-dim);font-weight:400;">by ${esc(c.artist || '?')}</span></div>
          ${c.charge_summary ? `<div style="font-size:0.82rem;color:var(--text-dim);margin-top:0.2rem;">${esc(c.charge_summary)}</div>` : ''}
        </div>`).join('');
    el.dataset.loaded = '1';
  } catch (err) { fail(el, err); }
}

// ---------- Submissions (misread / satirical) ----------
async function loadSubmissions() {
  const el = document.getElementById('ud-panel-submissions');
  loading(el);
  try {
    const data = await fetchJson(`/api/admin/users/${encodeURIComponent(USER_IDENT)}/submissions?limit=300`);
    if (!data.items.length) { el.innerHTML = '<div class="ud-card">No misread / satirical submissions.</div>'; el.dataset.loaded = '1'; return; }
    el.innerHTML = `<p style="color:var(--text-dim);font-size:0.78rem;margin-bottom:0.6rem;">${data.items.length} of ${data.total}</p>` +
      data.items.map((s) => `
        <div class="ud-li">
          <div class="ud-li-meta">
            <span class="ud-pill">${esc(s.report_type)}</span>
            <span class="ud-pill">${esc(s.status)}</span>
            <span>${dt(s.created_at)}</span>
          </div>
          <div style="font-weight:600;">"${esc(s.song_title)}" <span style="color:var(--text-dim);font-weight:400;">by ${esc(s.song_artist)} (${esc(s.song_color)})</span></div>
          <div style="font-size:0.84rem;color:var(--text);margin-top:0.25rem;white-space:pre-wrap;">${esc(s.message)}</div>
        </div>`).join('');
    el.dataset.loaded = '1';
  } catch (err) { fail(el, err); }
}

// ---------- Payments / credit ledger ----------
async function loadPayments() {
  const el = document.getElementById('ud-panel-payments');
  loading(el);
  try {
    const d = await fetchJson(`/api/admin/users/${encodeURIComponent(USER_IDENT)}/payments?limit=300`);
    const ledger = d.ledger.length
      ? d.ledger.map((r) => `
          <tr>
            <td class="${r.delta >= 0 ? 'pos' : 'neg'}">${r.delta >= 0 ? '+' : ''}${r.delta}</td>
            <td>${esc(r.bucket)}</td>
            <td>${esc(r.reason)}</td>
            <td style="color:var(--text-hint);">${esc(r.ref_type || '')}${r.ref_id ? ' / ' + esc(r.ref_id) : ''}</td>
            <td style="color:var(--text-hint);">${dt(r.created_at)}</td>
          </tr>`).join('')
      : `<tr><td colspan="5" style="color:var(--text-hint);">No ledger entries.</td></tr>`;
    const comp = !!d.comp_unlimited;
    el.innerHTML = `
      <div class="ud-card">
        <dl class="ud-meta-grid">
          <div><dt>Subscription</dt><dd>${esc(d.subscription_tier || 'free')}${d.subscription_status ? ' (' + esc(d.subscription_status) + ')' : ''}</dd></div>
          <div><dt>Renews / ends</dt><dd>${dt(d.subscription_period_end)}</dd></div>
          <div><dt>Allowance credits</dt><dd>${d.allowance_credits}</dd></div>
          <div><dt>Purchased credits</dt><dd>${d.purchased_credits}</dd></div>
          <div><dt>Unlimited Charger</dt><dd>${comp ? '<strong style="color:var(--accent-strong);">ON (comped)</strong>' : 'off'}</dd></div>
          <div><dt>Free charges today</dt><dd>${comp ? 'n/a (unlimited)' : (d.daily_free_eligible ? `${d.daily_free_used} / ${d.daily_free_limit} used (${d.daily_free_remaining} left)` : 'n/a (paid tier)')}</dd></div>
          <div><dt>Stripe customer</dt><dd>${d.has_stripe_customer ? 'yes' : 'no'}</dd></div>
        </dl>
      </div>
      <div class="ud-card">
        <h2 class="section-title" style="margin-top:0;">Admin actions</h2>
        <div class="ud-comp-row">
          <div>
            <strong>Unlimited Lyrical Charger</strong>
            <p style="color:var(--text-dim);font-size:0.8rem;margin:0.2rem 0 0;">Zero-cost single-song + album charges, no daily cap. Library access is unchanged.</p>
          </div>
          <button id="udCompBtn" class="ud-btn">${comp ? 'Revoke comp' : 'Grant unlimited'}</button>
        </div>
        <div class="ud-grant-row">
          <div>
            <strong>Grant / deduct credits</strong>
            <p style="color:var(--text-dim);font-size:0.8rem;margin:0.2rem 0 0;">Adjusts the permanent purchased bucket. Use a negative amount to deduct.</p>
          </div>
          <div class="ud-grant-controls">
            <input id="udGrantAmt" type="number" step="1" placeholder="amount" class="ud-input" />
            <input id="udGrantNote" type="text" placeholder="note (optional)" class="ud-input ud-input-note" />
            <button id="udGrantBtn" class="ud-btn">Apply</button>
          </div>
        </div>
        <p id="udBillNote" class="ud-bill-note"></p>
      </div>
      <div class="ud-card">
        <h2 class="section-title" style="margin-top:0;">Credit ledger (${d.ledger_total})</h2>
        <table class="ud-led">
          <thead><tr><th>Delta</th><th>Bucket</th><th>Reason</th><th>Ref</th><th>When</th></tr></thead>
          <tbody>${ledger}</tbody>
        </table>
      </div>`;
    el.dataset.loaded = '1';
    document.getElementById('udCompBtn').addEventListener('click', () => toggleComp(!comp));
    document.getElementById('udGrantBtn').addEventListener('click', grantCredits);
  } catch (err) { fail(el, err); }
}

async function toggleComp(unlimited) {
  const note = document.getElementById('udBillNote');
  const btn = document.getElementById('udCompBtn');
  if (unlimited === false && !confirm('Revoke unlimited Charger comp for this user?')) return;
  btn.disabled = true;
  note.textContent = 'Saving...';
  try {
    const resp = await adminFetch(`/api/admin/users/${encodeURIComponent(USER_IDENT)}/comp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ unlimited }),
    });
    if (!resp.ok) throw new Error(await resp.text());
    note.textContent = unlimited ? 'Unlimited Charger granted.' : 'Comp revoked.';
    document.getElementById('ud-panel-payments').dataset.loaded = '';
    document.getElementById('ud-panel-profile').dataset.loaded = '';
    loadPayments();
  } catch (e) {
    note.textContent = 'Failed: ' + ((e && e.message) || 'error');
    btn.disabled = false;
  }
}

async function grantCredits() {
  const note = document.getElementById('udBillNote');
  const amt = parseInt(document.getElementById('udGrantAmt').value, 10);
  const text = (document.getElementById('udGrantNote').value || '').trim();
  if (!Number.isInteger(amt) || amt === 0) {
    note.textContent = 'Enter a non-zero whole number.';
    return;
  }
  const verb = amt > 0 ? `Grant ${amt}` : `Deduct ${-amt}`;
  if (!confirm(`${verb} credits for this user?`)) return;
  note.textContent = 'Saving...';
  try {
    const resp = await adminFetch(`/api/admin/users/${encodeURIComponent(USER_IDENT)}/grant-credits`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: amt, note: text || null }),
    });
    if (!resp.ok) throw new Error(await resp.text());
    const r = await resp.json();
    note.textContent = `Done. Balance now ${r.total_credits} (${r.allowance_credits} allowance / ${r.purchased_credits} purchased).`;
    document.getElementById('ud-panel-payments').dataset.loaded = '';
    document.getElementById('ud-panel-profile').dataset.loaded = '';
    loadPayments();
  } catch (e) {
    note.textContent = 'Failed: ' + ((e && e.message) || 'error');
  }
}

// ---------- Comments ----------
async function loadComments() {
  const el = document.getElementById('udCommentList');
  loading(el);
  try {
    const params = new URLSearchParams({ limit: '200' });
    if (commentFilter) params.set('state', commentFilter);
    const data = await fetchJson(`/api/admin/users/${encodeURIComponent(USER_IDENT)}/comments?${params.toString()}`);
    renderComments(data);
    document.getElementById('ud-panel-comments').dataset.loaded = '1';
  } catch (err) { fail(el, err); }
}

function renderComments(data) {
  const el = document.getElementById('udCommentList');
  if (!data.items.length) {
    el.innerHTML = `<p style="color:#666;">No comments match. (${data.total} total)</p>`;
    return;
  }
  el.innerHTML = `<p style="color:var(--text-dim);font-size:0.78rem;margin-bottom:0.6rem;">${data.items.length} of ${data.total} shown</p>` +
    data.items.map((c) => {
      const target = c.target_source ? `${c.target_type}/${c.target_source}#${c.target_id}` : `${c.target_type}#${c.target_id}`;
      const stateLabel = c.state.charAt(0).toUpperCase() + c.state.slice(1);
      const hidden = c.hidden_reason ? `<div class="ud-comment-hidden-reason">Hidden reason: ${esc(c.hidden_reason)}</div>` : '';
      return `
        <div class="ud-comment-card state-${esc(c.state)}">
          <div class="ud-comment-meta">
            <span class="ud-comment-state ud-state-${esc(c.state)}">${esc(stateLabel)}</span>
            <span class="ud-comment-target">${esc(target)}</span>
            <span>${dt(c.created_at)}</span>
            <span style="color:var(--text-hint);">#${c.id}</span>
          </div>
          <div class="ud-comment-body">${esc(c.content)}</div>
          ${hidden}
        </div>`;
    }).join('');
}
</script>
{% endblock %}
