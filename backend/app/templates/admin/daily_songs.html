{% extends "admin/_base.html" %}
{% set active_section = 'daily-songs' %}
{% block title %}Daily Songs — Admin{% endblock %}

{% block content %}
<div class="admin-key-row">
  <div class="form-group">
    <label>Date</label>
    <input type="date" id="songDate">
  </div>
</div>
<div class="form-group">
  <label>Editorial Summary</label>
  <textarea id="songEditorial" placeholder="One-line editorial for today's reading..."></textarea>
</div>
<h2 class="section-title">Top 10 Songs</h2>
<div class="entry-header">
  <span>#</span><span>Title</span><span>Artist</span><span>Color</span><span>Contam?</span>
</div>
<div id="songRows"></div>
<div style="margin-top:1rem;">
  <button onclick="submitSongReading()">Submit Song Reading</button>
</div>
<div class="status-msg" id="songStatus"></div>
{% endblock %}

{% block scripts %}
<script>
function onAdminReady() { /* no autoload — form is ready on mount */ }

document.getElementById('songDate').valueAsDate = new Date();

function generateRows(containerId, prefix, placeholderTitle) {
  const container = document.getElementById(containerId);
  for (let i = 1; i <= 10; i++) {
    const row = document.createElement('div');
    row.className = 'entry-row';
    row.innerHTML = `
      <span style="text-align:center;color:#666;">${i}</span>
      <input type="text" placeholder="${placeholderTitle}" data-field="${prefix}-title" data-pos="${i}">
      <input type="text" placeholder="Artist" data-field="${prefix}-artist" data-pos="${i}">
      <select data-field="${prefix}-color" data-pos="${i}" onchange="updateContamVisibility('${prefix}',${i})">
        ${colors.map(c => `<option value="${c}">${colorLabels[c]}</option>`).join('')}
      </select>
      <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;" id="${prefix}-contam-label-${i}">
        <input type="checkbox" data-field="${prefix}-contam" data-pos="${i}" onchange="toggleExtra('${prefix}',${i})" disabled> —
      </label>
    `;
    container.appendChild(row);

    const extra = document.createElement('div');
    extra.className = 'contam-fields';
    extra.id = `${prefix}-extra-${i}`;
    extra.innerHTML = `
      <div style="padding:0 0.5rem;">
        <input type="text" placeholder="Contamination note" data-field="${prefix}-contam_note" data-pos="${i}" style="margin-bottom:0.3rem;">
        <textarea placeholder="Charge summary / analysis" data-field="${prefix}-summary" data-pos="${i}" rows="2"></textarea>
      </div>
    `;
    container.appendChild(extra);
  }
}

generateRows('songRows', 'song', 'Song title');

function toggleExtra(prefix, pos) {
  const extra = document.getElementById(`${prefix}-extra-${pos}`);
  const cb = document.querySelector(`[data-field="${prefix}-contam"][data-pos="${pos}"]`);
  extra.classList.toggle('show', cb.checked);
}

function updateContamVisibility(prefix, pos) {
  const colorSel = document.querySelector(`[data-field="${prefix}-color"][data-pos="${pos}"]`);
  const cb = document.querySelector(`[data-field="${prefix}-contam"][data-pos="${pos}"]`);
  const label = document.getElementById(`${prefix}-contam-label-${pos}`);
  const topTier = ['violet', 'blue', 'green'].includes(colorSel.value);
  cb.disabled = !topTier;
  if (!topTier) {
    cb.checked = false;
    toggleExtra(prefix, pos);
  }
  label.lastChild.textContent = topTier ? ' Yes' : ' —';
}

function getField(field, pos) {
  return document.querySelector(`[data-field="${field}"][data-pos="${pos}"]`);
}

function collectEntries(prefix, chartSource) {
  const entries = [];
  for (let i = 1; i <= 10; i++) {
    const title = getField(`${prefix}-title`, i)?.value.trim();
    const artist = getField(`${prefix}-artist`, i)?.value.trim();
    if (!title || !artist) continue;
    entries.push({
      title,
      artist,
      position: i,
      rubric_color: getField(`${prefix}-color`, i)?.value || 'green',
      contaminated: getField(`${prefix}-contam`, i)?.checked || false,
      contamination_note: getField(`${prefix}-contam_note`, i)?.value.trim() || null,
      charge_summary: getField(`${prefix}-summary`, i)?.value.trim() || null,
      chart_source: chartSource,
    });
  }
  return entries;
}

async function submitSongReading() {
  const statusEl = document.getElementById('songStatus');
  statusEl.className = 'status-msg';
  const adminKey = document.getElementById('adminKey').value.trim();
  const readingDate = document.getElementById('songDate').value;
  const editorial = document.getElementById('songEditorial').value.trim();

  if (!adminKey) { showMsg(statusEl, 'Admin key required', 'error'); return; }
  if (!readingDate) { showMsg(statusEl, 'Date required', 'error'); return; }

  const songs = collectEntries('song', 'spotify');
  if (songs.length === 0) { showMsg(statusEl, 'Enter at least one song', 'error'); return; }

  try {
    const resp = await fetch('/api/admin/reading', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
      body: JSON.stringify({ date: readingDate, editorial_summary: editorial || null, songs }),
    });
    if (resp.status === 409) {
      const putResp = await fetch(`/api/admin/reading/${readingDate}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
        body: JSON.stringify({ editorial_summary: editorial || null, songs }),
      });
      if (!putResp.ok) throw new Error(await putResp.text());
      showMsg(statusEl, 'Song reading updated!', 'success');
      return;
    }
    if (!resp.ok) throw new Error(await resp.text());
    showMsg(statusEl, 'Song reading created!', 'success');
  } catch (e) { showMsg(statusEl, e.message, 'error'); }
}
</script>
{% endblock %}
