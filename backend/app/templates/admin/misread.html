{% extends "admin/_base.html" %}
{% set active_section = 'misread' %}
{% block title %}Misread Reports — Admin{% endblock %}

{% block content %}
<div class="filter-bar" id="misreadFilters">
  <button class="filter-btn active" onclick="filterMisread('')">All</button>
  <button class="filter-btn" onclick="filterMisread('pending')">Pending</button>
  <button class="filter-btn" onclick="filterMisread('reviewed')">Reviewed</button>
  <button class="filter-btn" onclick="filterMisread('accepted')">Accepted</button>
  <button class="filter-btn" onclick="filterMisread('rejected')">Rejected</button>
  <button class="filter-btn" onclick="filterMisread('flagged')">Flagged</button>
</div>

<h2 class="section-title">Submissions</h2>
<div id="misreadList"></div>
<div class="status-msg" id="misreadStatus"></div>

<h2 class="section-title">Banned Users</h2>
<div id="banList"></div>
{% endblock %}

{% block scripts %}
<script>
let currentMisreadFilter = '';

function onAdminReady() {
  loadMisread();
  loadBans();
}

function filterMisread(status) {
  currentMisreadFilter = status;
  document.querySelectorAll('#misreadFilters .filter-btn').forEach(b => {
    b.classList.toggle('active', (status === '' && b.textContent === 'All') || b.textContent.toLowerCase() === status);
  });
  loadMisread();
}

async function loadMisread() {
  try {
    const url = currentMisreadFilter
      ? `/api/admin/misread?status=${currentMisreadFilter}`
      : '/api/admin/misread';
    const resp = await adminFetch(url);
    if (!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    renderMisread(data);
  } catch (e) { showMsg(document.getElementById('misreadStatus'), e.message, 'error'); }
}

function renderMisread(list) {
  const el = document.getElementById('misreadList');
  if (!list.length) { el.innerHTML = '<p style="color:#666;">No submissions found.</p>'; return; }
  el.innerHTML = list.map(s => {
    const idTag = (s.report_type === 'satirical' ? 'SAT' : 'MIS') + '-' + s.id;
    return `
    <div class="misread-item status-${s.status}">
      <div>
        <span style="font-family:monospace;font-size:0.78rem;color:var(--text-dim);margin-right:0.5rem;">${idTag}</span>
        <span class="misread-song">${esc(s.song_title)}</span> — ${esc(s.song_artist)}
        <span class="status-badge ${s.status}">${s.status}</span>
        ${s.report_type === 'satirical' ? '<span class="status-badge" style="background:#fce4dc;color:var(--red);">SATIRICAL</span>' : ''}
      </div>
      <div class="misread-meta">
        ${s.user_handle
          ? `<strong style="color:var(--accent-strong);">@${esc(s.user_handle)}</strong> <span style="color:var(--text-hint);font-family:monospace;font-size:0.72rem;">(${esc(s.user_anon_id || '')})</span>`
          : `<em style="color:var(--text-hint);">${esc(s.first_name || '')} ${esc(s.last_name || '')}</em> ${s.email ? `&middot; ${esc(s.email)}` : ''} <span style="background:#fff0d0;color:var(--tier-orange);font-size:0.65rem;padding:0.05rem 0.35rem;border-radius:3px;text-transform:uppercase;letter-spacing:0.04em;margin-left:0.3rem;font-weight:700;">legacy</span>`}
        &middot; ${s.created_at ? `<time data-utc="${escHtml(s.created_at)}"></time>` : '—'}
        ${s.device_id ? `<br>Device: ${esc(s.device_id.slice(0, 8))}...` : ''}
        ${s.ip_address ? ` &middot; IP: ${esc(s.ip_address)}` : ''}
      </div>
      <div class="misread-msg">${esc(s.message)}</div>
      <div class="misread-actions">
        ${s.report_type === 'satirical' ? `
          ${s.status === 'pending' || s.status === 'reviewed' ? `
            <a class="btn-sm" style="background:var(--accent);color:#fff;text-decoration:none;display:inline-block;" href="/api/admin/recalibrate?flag=${s.id}">Recalibrate →</a>
            ${s.status === 'pending' ? `<button class="btn-sm" onclick="updateMisread(${s.id},'reviewed')">Mark Reviewed</button>` : ''}
            <button class="btn-sm" onclick="updateMisread(${s.id},'rejected')">Reject (not satire)</button>
            <button class="btn-sm btn-flag" onclick="flagAndBan(${s.id})">Flag &amp; Ban</button>
          ` : ''}
        ` : `
          <a class="btn-sm" style="background:var(--accent);color:#fff;text-decoration:none;display:inline-block;" href="/api/admin/recalibrate?song_source=${encodeURIComponent(s.song_source || '')}&song_id=${encodeURIComponent(s.song_id || '')}&q=${encodeURIComponent(s.song_title || '')}">Review &rarr;</a>
          ${s.status === 'pending' ? `
            <button class="btn-sm" onclick="updateMisread(${s.id},'reviewed')">Reviewed</button>
            <button class="btn-sm" onclick="updateMisread(${s.id},'accepted')">Accept</button>
            <button class="btn-sm" onclick="updateMisread(${s.id},'rejected')">Reject</button>
            <button class="btn-sm btn-flag" onclick="flagAndBan(${s.id})">Flag &amp; Ban</button>
          ` : s.status === 'reviewed' ? `
            <button class="btn-sm" onclick="updateMisread(${s.id},'accepted')">Accept</button>
            <button class="btn-sm" onclick="updateMisread(${s.id},'rejected')">Reject</button>
            <button class="btn-sm btn-flag" onclick="flagAndBan(${s.id})">Flag &amp; Ban</button>
          ` : ''}
        `}
      </div>
    </div>
  `;
  }).join('');
}

async function updateMisread(id, status) {
  const statusEl = document.getElementById('misreadStatus');
  try {
    const resp = await fetch(`/api/admin/misread/${id}`, {
      method: 'PATCH',
      headers: adminHeaders(),
      body: JSON.stringify({ status }),
    });
    if (!resp.ok) throw new Error(await resp.text());
    showMsg(statusEl, `Submission #${id} marked as ${status}`, 'success');
    loadMisread();
  } catch (e) { showMsg(statusEl, e.message, 'error'); }
}

async function flagAndBan(id) {
  if (!confirm('Flag this submission and permanently ban this user?')) return;
  const statusEl = document.getElementById('misreadStatus');
  try {
    const resp = await fetch(`/api/admin/misread/${id}/ban`, {
      method: 'POST',
      headers: adminHeaders(),
    });
    if (!resp.ok) throw new Error(await resp.text());
    showMsg(statusEl, `Submission #${id} flagged and user banned`, 'success');
    loadMisread();
    loadBans();
  } catch (e) { showMsg(statusEl, e.message, 'error'); }
}

async function loadBans() {
  const el = document.getElementById('banList');
  try {
    const resp = await adminFetch('/api/admin/misread/bans');
    if (!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    renderBans(data);
  } catch (e) { el.innerHTML = `<p style="color:var(--red);">${esc(e.message)}</p>`; }
}

function renderBans(list) {
  const el = document.getElementById('banList');
  if (!list.length) { el.innerHTML = '<p style="color:#666;">No active bans.</p>'; return; }
  el.innerHTML = list.map(b => `
    <div class="ban-item">
      <div>
        ${b.device_id ? `Device: ${esc(b.device_id.slice(0, 8))}...` : ''}
        ${b.ip_address ? ` IP: ${esc(b.ip_address)}` : ''}
        <span class="meta">${b.reason ? esc(b.reason) : ''} &middot; ${adminFmt(b.created_at, {year:'numeric',month:'short',day:'numeric'})}</span>
      </div>
      <button class="btn-sm btn-danger" onclick="removeBan(${b.id})">Unban</button>
    </div>
  `).join('');
}

async function removeBan(id) {
  if (!confirm('Remove this ban?')) return;
  try {
    const resp = await fetch(`/api/admin/misread/bans/${id}`, { method: 'DELETE', headers: adminHeaders() });
    if (!resp.ok) throw new Error(await resp.text());
    loadBans();
  } catch (e) { showMsg(document.getElementById('misreadStatus'), e.message, 'error'); }
}
</script>
{% endblock %}
