{% extends "admin/_base.html" %}
{% set active_section = 'submissions' %}
{% block title %}LC Submissions — Admin{% endblock %}

{% block content %}
<div class="stats-grid" id="subStats">
  <div class="stat-card"><div class="val" id="statTotal">—</div><div class="label">Total</div></div>
  <div class="stat-card"><div class="val" id="statToday">—</div><div class="label">Today</div></div>
  <div class="stat-card"><div class="val" id="statContam">—</div><div class="label">Contaminated</div></div>
  <div class="stat-card"><div class="val" id="statConfidence">—</div><div class="label">Avg Confidence</div></div>
</div>
<div id="subColorBreakdown" style="margin-bottom:1rem;"></div>

<div class="filter-bar" id="subFilters">
  <button class="filter-btn active" onclick="filterSubs('')">All</button>
  <button class="filter-btn" onclick="filterSubs('violet')"><span class="color-dot violet"></span>Violet</button>
  <button class="filter-btn" onclick="filterSubs('blue')"><span class="color-dot blue"></span>Blue</button>
  <button class="filter-btn" onclick="filterSubs('green')"><span class="color-dot green"></span>Green</button>
  <button class="filter-btn" onclick="filterSubs('orange')"><span class="color-dot orange"></span>Orange</button>
  <button class="filter-btn" onclick="filterSubs('red')"><span class="color-dot red"></span>Red</button>
</div>

<div class="filter-bar" id="subSourceFilters" style="margin-top:-0.5rem;">
  <span style="font-size:0.75rem;color:#666;align-self:center;margin-right:0.4rem;">SOURCE:</span>
  <button class="filter-btn active" onclick="filterSubsSource('')">All sources</button>
  <button class="filter-btn" onclick="filterSubsSource('lyrical_charger')">Lyrical Charger</button>
  <button class="filter-btn" onclick="filterSubsSource('chadlewine')">chadlewine.com</button>
  <button class="filter-btn" onclick="filterSubsSource('paste_lyrics')">paste_lyrics (legacy)</button>
  <button class="filter-btn" onclick="filterSubsSource('search')">search (legacy)</button>
  <button class="filter-btn" onclick="filterSubsSource('batch')">batch (bootstrap)</button>
</div>

<div class="sub-header">
  <span>ID</span><span>When</span><span>Title</span><span>Artist</span><span>Color</span><span>Charge</span><span>Conf.</span><span>IP</span><span>Actions</span>
</div>
<div id="subList"></div>
<div class="pagination" id="subPagination"></div>
<div class="status-msg" id="subStatus"></div>
{% endblock %}

{% block scripts %}
<script>
let currentSubFilter = '';
let currentSubSource = '';
let subOffset = 0;
const subLimit = 50;

function onAdminReady() {
  loadSubStats();
  loadSubs();
}

function filterSubs(color) {
  currentSubFilter = color;
  subOffset = 0;
  document.querySelectorAll('#subFilters .filter-btn').forEach(b => {
    const isAll = color === '' && b.textContent.trim() === 'All';
    const isColor = b.textContent.trim().toLowerCase() === color;
    b.classList.toggle('active', isAll || isColor);
  });
  loadSubs();
}

function filterSubsSource(src) {
  currentSubSource = src;
  subOffset = 0;
  document.querySelectorAll('#subSourceFilters .filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  loadSubs();
}

async function loadSubStats() {
  try {
    const resp = await adminFetch('/api/admin/submissions/stats');
    if (!resp.ok) throw new Error(await resp.text());
    const s = await resp.json();
    document.getElementById('statTotal').textContent = s.total;
    document.getElementById('statToday').textContent = s.today;
    document.getElementById('statContam').textContent = s.contaminated_count;
    document.getElementById('statConfidence').textContent = s.avg_confidence !== null ? (s.avg_confidence * 100).toFixed(1) + '%' : '—';

    const breakdown = document.getElementById('subColorBreakdown');
    const colorOrder = ['violet', 'blue', 'green', 'orange', 'red'];
    breakdown.innerHTML = colorOrder
      .filter(c => s.by_color[c])
      .map(c => `<span style="margin-right:1rem;font-size:0.85rem;"><span class="color-dot ${c}"></span>${colorLabels[c]}: ${s.by_color[c]}</span>`)
      .join('');
  } catch (e) { /* stats are non-critical */ }
}

async function loadSubs() {
  try {
    let url = `/api/admin/submissions?limit=${subLimit}&offset=${subOffset}`;
    if (currentSubFilter) url += `&color=${currentSubFilter}`;
    if (currentSubSource) url += `&source=${encodeURIComponent(currentSubSource)}`;
    const resp = await adminFetch(url);
    if (!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    renderSubs(data);
  } catch (e) { showMsg(document.getElementById('subStatus'), e.message, 'error'); }
}

function renderSubs(list) {
  const el = document.getElementById('subList');
  if (!list.length) { el.innerHTML = '<p style="color:#666;">No submissions found.</p>'; renderSubPagination(0); return; }
  el.innerHTML = list.map(s => {
    const chargeClass = s.charge_value > 0 ? 'positive' : s.charge_value < 0 ? 'negative' : 'zero';
    const chargeStr = s.charge_value !== null ? (s.charge_value > 0 ? '+' : '') + s.charge_value : '—';
    const confPct = s.confidence !== null ? Math.round(s.confidence * 100) : 0;
    const whenStr = s.submitted_at ? String(s.submitted_at).replace('T', ' ').slice(0, 19) : '—';
    return `
      <div class="sub-row">
        <span style="color:#666;">${s.id}</span>
        <span style="font-size:0.75rem;color:#555;">${whenStr}</span>
        <span>${esc(s.title || '(no title)')}${s.contaminated ? ' <span class="contam-tag">CONTAM</span>' : ''}${s.dogma_referenced ? ' <span class="dogma-tag">DOGMA</span>' : ''}</span>
        <span>${esc(s.artist || '(no artist)')}</span>
        <span><span class="color-dot ${s.rubric_color}"></span>${colorLabels[s.rubric_color] || s.rubric_color}</span>
        <span class="sub-charge ${chargeClass}">${chargeStr}</span>
        <span><span class="confidence-bar"><span class="fill" style="width:${confPct}%"></span></span>${confPct}%</span>
        <span style="font-size:0.75rem;color:#555;">${s.ip_address ? esc(s.ip_address) : '—'}<br><span style="color:#555;">${esc(s.source || '—')}</span></span>
        <span class="actions">
          <button class="btn-sm btn-danger" onclick="deleteSub(${s.id})" title="Delete">Del</button>
        </span>
      </div>`;
  }).join('');
  renderSubPagination(list.length);
}

function renderSubPagination(count) {
  const el = document.getElementById('subPagination');
  const page = Math.floor(subOffset / subLimit) + 1;
  el.innerHTML = `
    ${subOffset > 0 ? `<button class="btn-sm" onclick="subPage(-1)">Prev</button>` : ''}
    <span class="page-info">Page ${page} &middot; showing ${count} results</span>
    ${count >= subLimit ? `<button class="btn-sm" onclick="subPage(1)">Next</button>` : ''}
  `;
}

function subPage(dir) {
  subOffset = Math.max(0, subOffset + dir * subLimit);
  loadSubs();
}

async function deleteSub(id) {
  if (!confirm(`Delete submission #${id}? This cannot be undone.`)) return;
  const statusEl = document.getElementById('subStatus');
  try {
    const resp = await fetch(`/api/admin/submissions/${id}`, { method: 'DELETE', headers: adminHeaders() });
    if (!resp.ok) throw new Error(await resp.text());
    showMsg(statusEl, `Submission #${id} deleted`, 'success');
    loadSubs();
    loadSubStats();
  } catch (e) { showMsg(statusEl, e.message, 'error'); }
}
</script>
{% endblock %}
