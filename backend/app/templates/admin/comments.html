{% extends "admin/_base.html" %}
{% set active_section = 'lobby-mod' %}
{% block title %}Moderation -- Comments -- Admin{% endblock %}

{% block subtabs %}
<nav class="admin-subtabs" aria-label="Moderation sub-sections">
  <a class="admin-subtab active" href="/api/admin/dashboard/lobby-mod">Comments</a>
</nav>
{% endblock %}

{% block content %}
<style>
  .cmt-card { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 6px; padding: 0.85rem 1rem; margin-bottom: 0.75rem; border-left: 3px solid var(--border); }
  .cmt-card.is-hidden { border-left-color: var(--tier-orange); }
  .cmt-card.is-banned { border-left-color: var(--red); opacity: 0.85; }
  .cmt-meta { font-size: 0.78rem; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin-bottom: 0.4rem; }
  .cmt-handle { font-family: monospace; color: var(--text); font-weight: 600; }
  .cmt-author-status { font-size: 0.7rem; padding: 0.05rem 0.4rem; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.05em; background: var(--panel-strong); color: var(--text-dim); }
  .cmt-author-status.banned { background: #fce4dc; color: var(--red); }
  .cmt-author-status.suspended { background: #fff0d0; color: var(--tier-orange); }
  .cmt-target { font-family: monospace; font-size: 0.75rem; color: var(--text-hint); }
  .cmt-body { font-size: 0.9rem; line-height: 1.5; color: var(--text); white-space: pre-wrap; word-wrap: break-word; padding: 0.4rem 0; }
  .cmt-hidden-banner { background: #fff0d0; border: 1px solid var(--tier-orange); color: var(--tier-orange); padding: 0.35rem 0.6rem; border-radius: 4px; font-size: 0.78rem; margin-bottom: 0.4rem; }
  .cmt-reports { background: #fff; border: 1px solid var(--border-soft); border-radius: 4px; padding: 0.4rem 0.6rem; margin: 0.4rem 0; }
  .cmt-reports h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 0.3rem; }
  .cmt-report-row { font-size: 0.8rem; padding: 0.25rem 0; border-top: 1px solid var(--border-soft); }
  .cmt-report-row:first-of-type { border-top: none; }
  .cmt-report-row .reason { font-weight: 600; color: var(--text); margin-right: 0.4rem; }
  .cmt-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.4rem; }
  .cmt-actions button { padding: 0.25rem 0.7rem; font-size: 0.78rem; }
</style>

<div class="filter-bar" id="cmtFilters">
  <button class="filter-btn active" data-filter="reported">Reported</button>
  <button class="filter-btn" data-filter="hidden">Hidden</button>
  <button class="filter-btn" data-filter="banned_authors">Banned authors</button>
  <button class="filter-btn" data-filter="all">All</button>
</div>

<h2 class="section-title">Queue</h2>
<div id="cmtList"><p style="color:#666;">Loading...</p></div>
<div class="status-msg" id="cmtStatus"></div>

{% endblock %}

{% block scripts %}
<script>
let currentFilter = 'reported';

function onAdminReady() {
  document.querySelectorAll('#cmtFilters .filter-btn').forEach((b) => {
    b.addEventListener('click', () => {
      currentFilter = b.dataset.filter;
      document.querySelectorAll('#cmtFilters .filter-btn').forEach((x) => x.classList.toggle('active', x === b));
      loadQueue();
    });
  });
  loadQueue();
}

async function loadQueue() {
  const listEl = document.getElementById('cmtList');
  listEl.innerHTML = '<p style="color:#666;">Loading...</p>';
  try {
    const resp = await adminFetch(`/api/admin/comments?filter=${currentFilter}&limit=100`);
    if (!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    renderQueue(data);
  } catch (err) {
    listEl.innerHTML = `<p style="color:var(--red);">${esc(err.message || 'Failed to load.')}</p>`;
  }
}

function renderQueue(data) {
  const el = document.getElementById('cmtList');
  if (!data.items || !data.items.length) {
    el.innerHTML = '<p style="color:#666;">Nothing in this filter.</p>';
    return;
  }
  el.innerHTML = data.items.map(renderItem).join('');
}

function targetLink(item) {
  if (item.target_type === 'song' && item.target_source) {
    return `${item.target_type}/${item.target_source}#${item.target_id}`;
  }
  return `${item.target_type}#${item.target_id}`;
}

function renderItem(item) {
  const classes = ['cmt-card'];
  if (item.hidden) classes.push('is-hidden');
  if (item.author_status === 'banned') classes.push('is-banned');

  const authorStatusBadge = item.author_status !== 'active'
    ? `<span class="cmt-author-status ${esc(item.author_status)}">${esc(item.author_status)}</span>`
    : '';
  const handle = item.author_handle
    ? `<span class="cmt-handle">@${esc(item.author_handle)}</span>`
    : `<span class="cmt-handle">${esc(item.author_anon_id)}</span>`;

  const hiddenBanner = item.hidden
    ? `<div class="cmt-hidden-banner">HIDDEN: ${esc(item.hidden_reason || '(no reason recorded)')}</div>`
    : '';

  const reportsBlock = item.reports && item.reports.length
    ? `<div class="cmt-reports">
         <h4>Reports (${item.pending_report_count} pending of ${item.reports.length})</h4>
         ${item.reports.map((r) => `
           <div class="cmt-report-row">
             <span class="reason">${esc(r.reason)}</span>
             <span style="color:var(--text-dim);">${esc(r.reporter_anon_id)} &middot; ${new Date(r.created_at).toLocaleString()} &middot; ${esc(r.status)}</span>
             ${r.notes ? `<div style="color:var(--text-dim);margin-top:0.15rem;">${esc(r.notes)}</div>` : ''}
           </div>
         `).join('')}
       </div>`
    : '';

  const actions = [];
  if (item.hidden) {
    actions.push(`<button class="btn-sm" onclick="action(${item.id},'unhide')">Unhide</button>`);
  } else {
    actions.push(`<button class="btn-sm" onclick="actHide(${item.id})">Hide</button>`);
  }
  actions.push(`<button class="btn-sm btn-danger" onclick="actDelete(${item.id})">Delete</button>`);
  if (item.author_status !== 'banned') {
    actions.push(`<button class="btn-sm" onclick="actCooldown(${item.id})">Cooldown 24h</button>`);
    actions.push(`<button class="btn-sm btn-danger" onclick="actBan(${item.id})">Ban author</button>`);
  }
  if (item.pending_report_count > 0) {
    actions.push(`<button class="btn-sm" onclick="action(${item.id},'dismiss-reports')">Dismiss reports</button>`);
  }

  return `
    <div class="${classes.join(' ')}">
      <div class="cmt-meta">
        ${handle}
        ${authorStatusBadge}
        <span class="cmt-target">${esc(targetLink(item))}</span>
        <span style="color:var(--text-dim);">${new Date(item.created_at).toLocaleString()}</span>
        <span style="color:var(--text-hint);">#${item.id}</span>
      </div>
      ${hiddenBanner}
      <div class="cmt-body">${esc(item.content)}</div>
      ${reportsBlock}
      <div class="cmt-actions">${actions.join('')}</div>
    </div>
  `;
}

async function action(id, path, payload) {
  const statusEl = document.getElementById('cmtStatus');
  try {
    const opts = { method: 'POST', headers: adminHeaders() };
    if (payload !== undefined) opts.body = JSON.stringify(payload);
    const resp = await fetch(`/api/admin/comments/${id}/${path}`, opts);
    const body = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(body.detail || resp.statusText);
    let msg = `Done: ${path} on comment #${id}.`;
    if (body.clerk_ban_succeeded === false) msg += ' (Clerk API ban call FAILED -- local ban only)';
    showMsg(statusEl, msg, 'success');
    loadQueue();
  } catch (err) {
    showMsg(statusEl, err.message || String(err), 'error');
  }
}

function actHide(id) {
  const reason = window.prompt('Reason for hiding (visible to the author):');
  if (!reason) return;
  action(id, 'hide', { reason });
}

function actCooldown(id) {
  const reason = window.prompt('Reason for 24h cooldown (optional):') || null;
  action(id, 'cooldown', { hours: 24, reason });
}

function actBan(id) {
  if (!window.confirm('Ban this account? Closes the Clerk account too. This is the final step in the ladder.')) return;
  const reason = window.prompt('Reason (visible in audit log):');
  if (!reason) return;
  action(id, 'ban', { reason });
}

function actDelete(id) {
  if (!window.confirm('Delete this comment? It will be removed from public view permanently. Distinct from Hide (reversible) and from a user Take Back (preserves attribution).')) return;
  const reason = window.prompt('Reason (visible in audit log):');
  if (!reason) return;
  action(id, 'delete', { reason });
}
</script>
{% endblock %}
