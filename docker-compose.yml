services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/data
    environment:
      - RC_ADMIN_KEY=${RC_ADMIN_KEY:-change-me}
      - DATABASE_URL=sqlite:///./data/rising_compass.db
      - CORS_ORIGINS=["http://localhost:3000","https://risingcompass.com"]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
