services:
  backend:
    build: ./backend
    container_name: rc-backend
    networks:
      default:
      le-proxy:
        aliases:
          - rc-backend
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/data
      - /root/risingcompass-backups:/app/data/backups
      # Read-only frontend templates for server-side meta rendering of
      # /songs/<slug> + /artists/<slug> (app/routers/page_ssr.py). Same source
      # the nginx static mount uses, so it updates with the frontend git pull.
      - ./frontend:/app/frontend:ro
      # Prose provenance anchoring (dark unless PROVENANCE_ENABLED=true): a
      # write-authenticated clone of the public anchor repo the sweep commits +
      # pushes hash-only batches into, plus the SSH deploy key it pushes with.
      # Both are owned by uid 1000 (appuser) on the host; the clone's
      # core.sshCommand points git at /provenance-key. See
      # RISING-COMPASS-PROSE-PROVENANCE.md SS5.
      - /root/rising-compass-provenance:/provenance
      - /root/.ssh/rcprov_deploy:/provenance-key:ro
      # MaxMind GeoLite2 country DB for the cookie consent bar's geo-aware
      # default (/api/geo-country). Read-only; refresh on the host. If the file
      # is absent the endpoint returns null and the bar behaves as opt-in.
      - /root/geoip:/geoip:ro
    environment:
      - RC_ADMIN_KEY=${RC_ADMIN_KEY:-change-me}
      - RC_API_KEY=${RC_API_KEY:-change-me}
      - RC_SERVICE_KEY=${RC_SERVICE_KEY}
      - RC_BACKUP_KEY=${RC_BACKUP_KEY}
      - RC_READING_CRON_KEY=${RC_READING_CRON_KEY}
      - RC_LYRICS_SUPPLY_KEY=${RC_LYRICS_SUPPLY_KEY}
      - RC_PROVENANCE_CRON_KEY=${RC_PROVENANCE_CRON_KEY}
      # Outbound classification push to chadlewine (badge cache). Ships dark
      # unless both are set; the secret must equal chadlewine's RC_WEBHOOK_SECRET.
      - CHADLEWINE_WEBHOOK_URL=${CHADLEWINE_WEBHOOK_URL:-}
      - CHADLEWINE_WEBHOOK_SECRET=${CHADLEWINE_WEBHOOK_SECRET:-}
      # Faultline (internal error ledger). ENVIRONMENT tags captured faults
      # prod-vs-local (local dev shares this DB via the tunnel, so the tag is
      # what keeps prod triage legible). RC_ERROR_AGENT_KEY arms the agent lane
      # (ships dark / 503 until set). Capture itself is always on + fail-safe.
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - RC_ERROR_AGENT_KEY=${RC_ERROR_AGENT_KEY}
      - FAULTLINE_CAPTURE_LEVEL=${FAULTLINE_CAPTURE_LEVEL:-ERROR}
      - FAULTLINE_OCCURRENCE_RETENTION=${FAULTLINE_OCCURRENCE_RETENTION:-50}
      # Prose provenance anchoring. Ships DARK (PROVENANCE_ENABLED unset/false).
      # When enabled, PROVENANCE_REPO_PATH must be a volume-mounted, write-
      # authenticated git clone of the public anchor repo, and the image must
      # carry `git` + the `ots` CLI (opentimestamps-client in requirements.txt).
      - PROVENANCE_ENABLED=${PROVENANCE_ENABLED:-false}
      - PROVENANCE_REPO_PATH=${PROVENANCE_REPO_PATH}
      - PROVENANCE_GIT_AUTHOR=${PROVENANCE_GIT_AUTHOR:-rc-provenance <provenance@risingcompass.net>}
      # Integrity re-verify cron: proofs to `ots verify` per run (round-robin).
      - PROVENANCE_REVERIFY_SAMPLE=${PROVENANCE_REVERIFY_SAMPLE:-25}
      # Dead-man's-switch ping URL for the sweep cron (empty = dark / no ping).
      - PROVENANCE_HEARTBEAT_URL=${PROVENANCE_HEARTBEAT_URL}
      # Admin Provenance page links-out: public repo web URL + block explorer base.
      - PROVENANCE_REPO_URL=${PROVENANCE_REPO_URL:-https://github.com/chadworksweb/rising-compass-provenance}
      - PROVENANCE_BLOCK_EXPLORER=${PROVENANCE_BLOCK_EXPLORER:-https://blockstream.info/block-height/}
      # Build 6 social broadcaster. Ships DARK: with SOCIAL_BROADCAST_ENABLED
      # unset/false (or Buffer unconfigured) the cron selects/renders/ledgers but
      # never pushes. BUFFER_PROFILE_IDS is a JSON map platform->Buffer channel id.
      # BUFFER_ACCESS_TOKEN is a personal Buffer GraphQL API key (Bearer).
      # CARD_RENDER_BASE_URL is where /cards/ is served for the Playwright shot.
      - SOCIAL_BROADCAST_ENABLED=${SOCIAL_BROADCAST_ENABLED:-false}
      - BUFFER_ACCESS_TOKEN=${BUFFER_ACCESS_TOKEN}
      - BUFFER_PROFILE_IDS=${BUFFER_PROFILE_IDS}
      - BUFFER_API_BASE=${BUFFER_API_BASE:-https://api.buffer.com}
      - CARD_RENDER_BASE_URL=${CARD_RENDER_BASE_URL:-https://risingcompass.net}
      - SOCIAL_LINK_BASE=${SOCIAL_LINK_BASE:-https://risingcompass.net}
      - SOCIAL_TRENDING_COUNT=${SOCIAL_TRENDING_COUNT:-3}
      - ADMIN_LOGIN_URL_TOKEN=${ADMIN_LOGIN_URL_TOKEN}
      # Cookie Domain for the admin session so one login covers both the root
      # (Site Admin) and api. (API Admin) hosts -- same-site subdomains.
      - ADMIN_COOKIE_DOMAIN=${ADMIN_COOKIE_DOMAIN:-risingcompass.net}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/rising_compass.db}
      - BACKUP_DATABASE_URL=${BACKUP_DATABASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","https://risingcompass.net","https://api.risingcompass.net"]}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AGENT_MODEL=${AGENT_MODEL:-claude-opus-4-8}
      # Editorials supplied from terminal (Claude Code), not an Anthropic call.
      # When true, _generate_editorial no-ops; set the editorial via
      # POST /drafts/{ref}/editorial (scripts/set_editorial.py).
      - EDITORIAL_TERMINAL_ONLY=${EDITORIAL_TERMINAL_ONLY:-false}
      # Libra Engine Compass (LEC) -- the extracted scoring brain. When the
      # lec.enabled system flag is on, the calibrator routes scoring through LEC
      # over the internal le-proxy network, falling back to in-process on any
      # failure. LEC_API_KEY must be a valid key from LEC's api_client_keys
      # (client rising-compass) or the auth-on LEC returns 401 and RC silently
      # falls back. Flag stays fail-closed until flipped in system_flags.
      - LEC_BASE_URL=${LEC_BASE_URL:-http://lec:8012}
      - LEC_API_KEY=${LEC_API_KEY}
      - LEC_TIMEOUT_SECONDS=${LEC_TIMEOUT_SECONDS:-120}
      - GENIUS_ACCESS_TOKEN=${GENIUS_ACCESS_TOKEN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-Rising Compass <compass@risingcompass.net>}
      - APPROVAL_EMAIL=${APPROVAL_EMAIL}
      - MISREAD_NOTIFY_EMAIL=${MISREAD_NOTIFY_EMAIL}
      # Root host: admin links in emails (ether-audits, lobby-mod, draft
      # approval) must point at risingcompass.net, where the Site Admin lives
      # post single-origin migration -- those pages 404 on the api host.
      - SITE_URL=${SITE_URL:-https://risingcompass.net}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_IDENTITY_WEBHOOK_SECRET=${STRIPE_IDENTITY_WEBHOOK_SECRET}
      - STRIPE_IDENTITY_RETURN_URL=${STRIPE_IDENTITY_RETURN_URL:-https://risingcompass.net/account/?identity=complete}
      # Billing (monetization M2). Distinct webhook signing secret so a
      # leaked donation or identity webhook key cannot forge billing events.
      # Price IDs are created in the Stripe dashboard once per environment
      # and pasted into the .env (any unset price ID returns 503 from the
      # corresponding checkout endpoint, so it's safe to leave a tier or
      # pack temporarily unconfigured).
      - STRIPE_BILLING_WEBHOOK_SECRET=${STRIPE_BILLING_WEBHOOK_SECRET}
      - STRIPE_PRICE_PLUS=${STRIPE_PRICE_PLUS}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO}
      - STRIPE_PRICE_PACK_25=${STRIPE_PRICE_PACK_25}
      - STRIPE_PRICE_PACK_100=${STRIPE_PRICE_PACK_100}
      - STRIPE_PRICE_PACK_300=${STRIPE_PRICE_PACK_300}
      - STRIPE_BILLING_RETURN_URL=${STRIPE_BILLING_RETURN_URL:-https://risingcompass.net/account/?billing=success}
      # PostHog server-side analytics (revenue + async album events). Same
      # project as the frontend snippet; unset -> server capture is a no-op.
      - POSTHOG_API_KEY=${POSTHOG_API_KEY}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}
      # Admin "View in PostHog" deep link (Site Admin -> user detail). PROJECT_ID
      # unset -> button hides. distinct_id is the Clerk user id (auth.js identify).
      - POSTHOG_PROJECT_ID=${POSTHOG_PROJECT_ID}
      - POSTHOG_UI_HOST=${POSTHOG_UI_HOST:-https://us.posthog.com}
      # MaxMind GeoLite2 DB paths (mounted read-only above). City DB resolves
      # the US subdivision for the California opt-in default.
      - GEOIP_DB_PATH=${GEOIP_DB_PATH:-/geoip/GeoLite2-Country.mmdb}
      - GEOIP_CITY_DB_PATH=${GEOIP_CITY_DB_PATH:-/geoip/GeoLite2-City.mmdb}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - CLERK_AUTHORIZED_PARTY=${CLERK_AUTHORIZED_PARTY:-https://risingcompass.net}
      - ADMIN_ALERT_EMAIL=${ADMIN_ALERT_EMAIL}
      - DO_SPACES_KEY=${DO_SPACES_KEY}
      - DO_SPACES_SECRET=${DO_SPACES_SECRET}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET:-crystopa-forge-backup1}
      - DO_SPACES_REGION=${DO_SPACES_REGION:-nyc3}
      - DO_SPACES_PREFIX=${DO_SPACES_PREFIX:-le-projects-01/risingcompass}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      # Gate for scripts/server_only/*. Local terminal sessions don't see this
      # var, so server-only scripts refuse to run there. Tools placed under
      # scripts/server_only/ may legitimately call the Anthropic API from
      # inside the container.
      - RC_SERVER_TOOLS=1
      # Where page_ssr.py reads the static templates (matches the ro mount).
      - FRONTEND_DIR=/app/frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/var/www/frontend:ro
      - /root/chadrising:/var/www/chadrising:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

networks:
  le-proxy:
    external: true

volumes:
  db-data:
  certbot-webroot:
  certbot-certs:
