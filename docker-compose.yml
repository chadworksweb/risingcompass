services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/data
      - /root/rising-compass-backups:/app/data/backups
    environment:
      - RC_ADMIN_KEY=${RC_ADMIN_KEY:-change-me}
      - DATABASE_URL=sqlite:///./data/rising_compass.db
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","https://risingcompass.net","https://api.risingcompass.net"]}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AGENT_MODEL=${AGENT_MODEL:-claude-sonnet-4-5-20250929}
      - GENIUS_ACCESS_TOKEN=${GENIUS_ACCESS_TOKEN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-Rising Compass <compass@risingcompass.net>}
      - APPROVAL_EMAIL=${APPROVAL_EMAIL}
      - SITE_URL=${SITE_URL:-https://api.risingcompass.net}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/var/www/frontend:ro
      - /root/chadrising:/var/www/chadrising:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  db-data:
  certbot-webroot:
  certbot-certs:
