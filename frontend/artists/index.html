  <a href="/account/" id="rc-account-link" class="rc-account-link" data-state="out">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span class="rc-account-label">Sign in</span>
  </a>
  </div>
  <script>
    (function(){
      function sync() {
        try {
          var link = document.getElementById('rc-account-link');
          if (!link) return;
          var label = link.querySelector('.rc-account-label');
          var authed = localStorage.getItem('rc_authed') === '1';
          if (authed) {
            if (label) label.textContent = 'Account';
            link.setAttribute('data-state', 'in');
            link.href = '/account/';
          } else {
            if (label) label.textContent = 'Sign in';
            link.setAttribute('data-state', 'out');
            // Preserve where the user came from so /account/ can route
            // them back after sign-in / sign-up. Only path + query +
            // hash; never an absolute URL.
            var ret = window.location.pathname + window.location.search + window.location.hash;
            if (ret && !ret.startsWith('/account/')) {
              link.href = '/account/?returnTo=' + encodeURIComponent(ret);
            } else {
              link.href = '/account/';
            }
          }
        } catch (_) {}
      }
      sync();
      // bfcache restore: pages cached by back/forward don't re-execute
      // scripts, but pageshow fires. Re-read localStorage so a sign-out
      // in another tab / on /account/ is reflected when the user
      // navigates back here.
      window.addEventListener('pageshow', sync);
      // Cross-tab sync: storage events fire in OTHER tabs when one tab
      // writes to localStorage. Catches the case where the user signs
      // out in one tab and switches to a tab that still says Account.
      window.addEventListener('storage', function (e) {
        if (e.key === 'rc_authed' || e.key === null) sync();
      });
    })();
  </script>
  <script src="/js/header-search.js" defer></script>

  <h1 class="artists-title" style="padding:0 1.5rem;margin:1rem 0 0;">Artists A&ndash;Z</h1>

  <main id="main" class="artists-index-main">
    <nav id="artists-letter-nav" class="artists-letter-nav" aria-label="Jump to letter" hidden></nav>
    <div id="artists-index-loading" class="artists-index-loading" role="status" aria-live="polite">Loading artists&hellip;</div>
    <div id="artists-index-list" class="artists-index-list"></div>
    <div id="artists-index-empty" class="artists-index-empty" hidden>No artists indexed yet.</div>
  </main>

  <div id="sr-announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script src="/artists/artists-api.js"></script>
  <script>
    (() => {
      'use strict';
      const listEl = document.getElementById('artists-index-list');
      const navEl = document.getElementById('artists-letter-nav');
      const loadingEl = document.getElementById('artists-index-loading');
      const emptyEl = document.getElementById('artists-index-empty');

      function escapeHtml(str) {
        const d = document.createElement('div');
        d.textContent = str == null ? '' : str;
        return d.innerHTML;
      }

      function letterKey(name) {
        const first = (name || '').trim().charAt(0).toUpperCase();
        return /[A-Z]/.test(first) ? first : '#';
      }

      async function load() {
        try {
          const data = await ArtistsAPI.listArtists();
          const artists = (data && data.artists) || [];
          if (!artists.length) {
            loadingEl.hidden = true;
            emptyEl.hidden = false;
            return;
          }

          const groups = new Map();
          for (const a of artists) {
            const k = letterKey(a.name);
            if (!groups.has(k)) groups.set(k, []);
            groups.get(k).push(a);
          }
          // Stable order: A-Z then '#' last for non-alphabetical starts.
          const keys = [...groups.keys()].sort((a, b) => {
            if (a === '#') return 1;
            if (b === '#') return -1;
            return a.localeCompare(b);
          });

          // Letter jump-nav (anchors into section ids).
          navEl.innerHTML = keys.map(k =>
            `<a href="#letter-${k === '#' ? 'hash' : k}" class="artists-letter-nav-link">${k}</a>`
          ).join('');
          navEl.hidden = false;

          // Groups.
          let html = '';
          for (const k of keys) {
            const secId = `letter-${k === '#' ? 'hash' : k}`;
            html += `<section class="artists-index-group" id="${secId}" aria-label="Artists starting with ${k}">`;
            html += `<h2 class="artists-index-letter">${k}</h2>`;
            html += '<ul class="artists-index-names">';
            for (const a of groups.get(k)) {
              html += `<li><a class="artists-index-link" href="/artists/${encodeURIComponent(a.slug)}">${escapeHtml(a.name)}</a></li>`;
            }
            html += '</ul></section>';
          }
          listEl.innerHTML = html;
          loadingEl.hidden = true;
        } catch (err) {
          console.error('Failed to load artist list:', err);
          loadingEl.textContent = 'Couldn’t load the artist list. Try refreshing.';
        }
      }

      load();
    })();
  </script>
