<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&family=JetBrains+Mono:wght@400&display=swap');
      .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 66px; letter-spacing: 2px; fill: #f4f4fa; }
      .tag { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 24px; letter-spacing: 5px; fill: #ffffff; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0e1a"/>
      <stop offset="55%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#060609"/>
    </linearGradient>

    <radialGradient id="bloom" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>

    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9933ff"/>
      <stop offset="25%" stop-color="#3388ff"/>
      <stop offset="50%" stop-color="#33cc55"/>
      <stop offset="75%" stop-color="#ffbb33"/>
      <stop offset="100%" stop-color="#ff3333"/>
    </linearGradient>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="2" fill="#000000" fill-opacity="0.05"/>
    </pattern>

    <filter id="borderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <filter id="dialGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Field -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#bloom)"/>
  <rect width="1200" height="630" fill="url(#scan)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Spectrum border (left -> right) with phosphor bloom -->
  <rect x="31" y="31" width="1138" height="568" fill="none" stroke="url(#spectrum)" stroke-width="14" opacity="0.85" filter="url(#borderGlow)"/>
  <rect x="31" y="31" width="1138" height="568" fill="none" stroke="url(#spectrum)" stroke-width="6"/>

  <!-- Compass gauge (centered), uncut, with teal phosphor glow -->
  <g filter="url(#dialGlow)">
    <svg x="415" y="60" width="370" height="236" viewBox="1.5 5.5 29 18.5" overflow="visible">
      <g fill="none" stroke-width="6">
        <path d="M 5,20 A 11,11 0 0,1 7.6,13.1" stroke="#9933ff"/>
        <path d="M 7.6,13.1 A 11,11 0 0,1 12.6,9.6" stroke="#3388ff"/>
        <path d="M 12.6,9.6 A 11,11 0 0,1 19.4,9.6" stroke="#33cc55"/>
        <path d="M 19.4,9.6 A 11,11 0 0,1 24.4,13.1" stroke="#ffbb33"/>
        <path d="M 24.4,13.1 A 11,11 0 0,1 27,20" stroke="#ff3333"/>
      </g>
      <polygon points="16,8 13.9,20 18.1,20" fill="#eeeef4"/>
      <circle cx="16" cy="20" r="3.2" fill="#00d4aa"/>
    </svg>
  </g>

  <!-- Title (two lines) -->
  <text class="title" x="600" y="396" text-anchor="middle">THE RISING</text>
  <text class="title" x="600" y="464" text-anchor="middle">COMPASS</text>

  <!-- Tagline (one line) -->
  <text class="tag" x="600" y="540" text-anchor="middle">MAKING THE VIBE VISIBLE</text>
</svg>
