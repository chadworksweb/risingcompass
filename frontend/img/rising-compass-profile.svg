<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;display=swap');
      .title { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 78px; letter-spacing: 3px; fill: #f4f4fa; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0e1a"/>
      <stop offset="55%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#060609"/>
    </linearGradient>

    <radialGradient id="bloom" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="42%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9933ff"/>
      <stop offset="25%" stop-color="#3388ff"/>
      <stop offset="50%" stop-color="#33cc55"/>
      <stop offset="75%" stop-color="#ffbb33"/>
      <stop offset="100%" stop-color="#ff3333"/>
    </linearGradient>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="2" fill="#000000" fill-opacity="0.05"/>
    </pattern>

    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="dialGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Field (fills full square; corners sit outside the circular crop) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#bloom)"/>
  <rect width="1024" height="1024" fill="url(#scan)"/>
  <rect width="1024" height="1024" fill="url(#vignette)"/>

  <!-- Compass gauge (centered above the title), with teal phosphor glow -->
  <g filter="url(#dialGlow)">
    <svg x="352" y="300" width="320" height="204" viewBox="1.5 5.5 29 18.5" overflow="visible">
      <g fill="none" stroke-width="6">
        <path d="M 5,20 A 11,11 0 0,1 5.84,15.79" stroke="#9933ff"/>
        <path d="M 5.84,15.79 A 11,11 0 0,1 11.79,9.84" stroke="#3388ff"/>
        <path d="M 11.79,9.84 A 11,11 0 0,1 20.21,9.84" stroke="#33cc55"/>
        <path d="M 20.21,9.84 A 11,11 0 0,1 26.16,15.79" stroke="#ffbb33"/>
        <path d="M 26.16,15.79 A 11,11 0 0,1 27,20" stroke="#ff3333"/>
      </g>
      <polygon points="16,8 13.9,20 18.1,20" fill="#eeeef4"/>
      <circle cx="16" cy="20" r="3.2" fill="#00d4aa"/>
    </svg>
  </g>

  <!-- Title (two lines, centered) -->
  <text class="title" x="512" y="600" text-anchor="middle">THE RISING</text>
  <text class="title" x="512" y="690" text-anchor="middle">COMPASS</text>
</svg>
