<header class="rc-header">
  <a href="/" class="rc-back-link" aria-label="Back to The Rising Compass">
    <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="6" fill="#0a0a14"/>
      <path d="M 5,20 A 11,11 0 0,1 7.6,13.1" fill="none" stroke="#9933ff" stroke-width="6" stroke-linecap="butt"/>
      <path d="M 7.6,13.1 A 11,11 0 0,1 12.6,9.6" fill="none" stroke="#3388ff" stroke-width="6" stroke-linecap="butt"/>
      <path d="M 12.6,9.6 A 11,11 0 0,1 19.4,9.6" fill="none" stroke="#33cc55" stroke-width="6" stroke-linecap="butt"/>
      <path d="M 19.4,9.6 A 11,11 0 0,1 24.4,13.1" fill="none" stroke="#ffbb33" stroke-width="6" stroke-linecap="butt"/>
      <path d="M 24.4,13.1 A 11,11 0 0,1 27,20" fill="none" stroke="#ff3333" stroke-width="6" stroke-linecap="butt"/>
      <polygon points="16,10 14.2,20 17.8,20" fill="#eeeef4"/>
      <circle cx="16" cy="20" r="3" fill="#00d4aa"/>
    </svg>
    <span>The Rising Compass</span>
  </a>
  <a href="/account/" id="rc-account-link" class="rc-account-link" data-state="out">Sign in</a>
  <script>
    (function(){
      function sync() {
        try {
          var link = document.getElementById('rc-account-link');
          if (!link) return;
          var authed = localStorage.getItem('rc_authed') === '1';
          if (authed) {
            link.textContent = 'Account';
            link.setAttribute('data-state', 'in');
            link.href = '/account/';
          } else {
            link.textContent = 'Sign in';
            link.setAttribute('data-state', 'out');
            // Preserve where the user came from so /account/ can route
            // them back after sign-in / sign-up. Only path + query +
            // hash; never an absolute URL.
            var ret = window.location.pathname + window.location.search + window.location.hash;
            if (ret && !ret.startsWith('/account/')) {
              link.href = '/account/?returnTo=' + encodeURIComponent(ret);
            } else {
              link.href = '/account/';
            }
          }
        } catch (_) {}
      }
      sync();
      // bfcache restore: pages cached by back/forward don't re-execute
      // scripts, but pageshow fires. Re-read localStorage so a sign-out
      // in another tab / on /account/ is reflected when the user
      // navigates back here.
      window.addEventListener('pageshow', sync);
      // Cross-tab sync: storage events fire in OTHER tabs when one tab
      // writes to localStorage. Catches the case where the user signs
      // out in one tab and switches to a tab that still says Account.
      window.addEventListener('storage', function (e) {
        if (e.key === 'rc_authed' || e.key === null) sync();
      });
    })();
  </script>
</header>
