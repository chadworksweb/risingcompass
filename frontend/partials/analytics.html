  (function () {
    // Personal opt-out: ?skip-analytics=1 sets a persistent flag for this
    // browser, =0 clears it. Lets the operator exclude their own devices
    // regardless of admin login.
    try {
      var p = new URLSearchParams(window.location.search).get('skip-analytics');
      if (p === '1') localStorage.setItem('rc_skip_analytics', '1');
      else if (p === '0') localStorage.removeItem('rc_skip_analytics');
